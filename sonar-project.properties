# SonarQube / SonarCloud project configuration
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters/

# Required: unique project key.
# SonarCloud default format: <organization-key>_<repository-name>
# TODO: 改成你 SonarCloud 项目页显示的 Project Key（通常就是下面这个默认值）
sonar.projectKey=zhangxunhui_code-quality

# SonarCloud only. Comment this line out when using a self-hosted SonarQube server.
# TODO: 改成你 SonarCloud 组织页显示的 Organization Key
sonar.organization=zhangxunhui

sonar.projectName=code-quality-sonar-demo
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage report produced by pytest-cov (relative to the project root).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

sonar.exclusions=**/__pycache__/**,demo/**,scripts/**
