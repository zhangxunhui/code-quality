name: CI

# 触发时机：
#   1. 合入 main 后，保证主干始终是“绿灯”状态；
#   2. 对 main 发起 / 更新 PR 时，做增量分析，并把结果回写到 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # 把单元测试结果回传为 PR 的 Check Run / 评论所需
  checks: write
  pull-requests: write

# 同一个 PR 连续 push 时，取消上一次运行，节省额度。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 单元测试
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --junitxml 生成测试报告，--cov-report=json 供后面的摘要步骤使用
      - name: Run tests with coverage
        run: |
          pytest \
            --junitxml=test-results.xml \
            --cov=pricing \
            --cov-report=xml \
            --cov-report=json:coverage.json \
            --cov-report=term-missing

      # 把每个用例的通过 / 失败明细回传到当前 PR（同仓库 PR 会生成评论）
      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results.xml
          check_name: Unit test results
          comment_title: Unit test results

      - name: Write coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          path = Path("coverage.json")
          if not path.exists():
              summary.write_text("### Coverage\n\n未生成覆盖率报告（测试可能提前失败）。\n", encoding="utf-8")
              raise SystemExit(0)

          totals = json.loads(path.read_text(encoding="utf-8"))["totals"]
          summary.write_text(
              "### Coverage\n\n"
              f"- 行覆盖率：**{totals['percent_covered']:.2f}%**\n"
              f"- 已覆盖 / 总语句数：{totals['covered_lines']} / {totals['num_statements']}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml
            coverage.json
          retention-days: 1

  # ------------------------------------------------------- SonarQube 代码分析
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: tests
    # 测试挂了就不再浪费额度做分析；但测试通过而门禁失败时，PR 依旧保持红色。
    if: success()
    steps:
      - name: Checkout (full history for accurate blame / new-code detection)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: test-reports

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud 填 https://sonarcloud.io；自建服务器填 http://<host>:9000
          # 在仓库 Settings → Secrets and variables → Actions → Variables 中配置
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube quality gate check
        id: gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Write quality gate result to job summary
        if: always()
        run: |
          status="${{ steps.gate.outputs.quality-gate-status }}"
          {
            echo "### SonarQube Quality Gate"
            echo ""
            echo "**${status:-UNKNOWN}**"
            echo ""
            echo "完整问题清单见 SonarQube / SonarCloud 项目页面。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 双保险：即使 action 自身没有因门禁失败而报错，这里也强制让 job 变红。
      - name: Enforce quality gate
        if: always()
        run: |
          status="${{ steps.gate.outputs.quality-gate-status }}"
          if [ "$status" != "PASSED" ]; then
            echo "::error::SonarQube Quality Gate 未通过（${status:-UNKNOWN}），请修复后重新提交。"
            exit 1
          fi
