# 本地自建 SonarQube Server（社区版）
# 启动：docker compose -f docker-compose.sonarqube.yml up -d
# 访问：http://localhost:9000 （首次登录 admin / admin，会要求改密码）
#
# 注意：GitHub 托管 runner 无法访问你本机的 localhost:9000。
# 本地自建镜像仅适合“在本机跑扫描”或配合 self-hosted runner 使用。
# Linux 主机若启动失败，先执行：sudo sysctl -w vm.max_map_count=524288

name: sonarqube-demo

services:
  db:
    image: postgres:17
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
